name: Manual & Tag Build, Publish Docker and Release Binaries

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      version:
        description: "请输入发布的版本号（例如 version-1.0.0 或 v1.0.0）"
        required: true
        default: "version-1.0.0"

permissions:
  contents: write
  packages: write

jobs:
  # ==========================================
  # 任务 1：构建并推送多架构 Docker 运行镜像至 GHCR
  # ==========================================
  build-and-push-docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.docker_meta.outputs.resolved_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Version and Prepare Docker Tags
        id: docker_meta
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW_VER="${{ github.event.inputs.version }}"
          else
            RAW_VER="${{ github.ref_name }}"
          fi
          echo "resolved_version=${RAW_VER}" >> $GITHUB_OUTPUT
          TAGS="ghcr.io/${REPO_LOWER}:latest,ghcr.io/${REPO_LOWER}:${RAW_VER}"
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================
  # 任务 2：交叉编译全平台独立二进制
  # ==========================================
  build-binaries:
    name: Build Binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            artifact: immich-SearchPlus2026-linux-amd64
          - os: linux
            arch: arm64
            artifact: immich-SearchPlus2026-linux-arm64
          - os: windows
            arch: amd64
            artifact: immich-SearchPlus2026-windows-amd64.exe
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Export Binary for ${{ matrix.os }}/${{ matrix.arch }}
        run: |
          mkdir -p ./release
          docker buildx build \
            --target export-stage \
            --output type=local,dest=./release \
            --build-arg TARGETOS=${{ matrix.os }} \
            --build-arg TARGETARCH=${{ matrix.arch }} \
            .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.os }}-${{ matrix.arch }}
          path: ./release/${{ matrix.artifact }}
          retention-days: 1
          overwrite: true

  # ==========================================
  # 任务 3：创建 GitHub Release 并挂载所有二进制附件
  # ==========================================
  publish-release:
    name: Create GitHub Release
    needs: [build-and-push-docker, build-binaries]
    runs-on: ubuntu-latest
    steps:
      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          path: ./release-files
          merge-multiple: true

      - name: List Artifacts
        run: |
          echo "=== 待发布的二进制产物清单 ==="
          ls -lh ./release-files

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ needs.build-and-push-docker.outputs.version }}
          tag_name: ${{ needs.build-and-push-docker.outputs.version }}
          files: ./release-files/*
          generate_release_notes: true
          draft: false
          prerelease: false
